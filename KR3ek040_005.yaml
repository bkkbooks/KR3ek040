body:
  text: 卷五治癰疽敗壞生肉地黃膏方生地黃一斤辛夷獨活當歸大黃芎藭黃耆薤白白芷芍藥黃芩續斷各二兩上十二味切以臘月豬脂四升微火煎白芷色黃膏成絞去滓敷日四治癰疽瘡生肌黃耆膏方黃耆細辛生地黃蜀椒去目閉口汗當歸芍藥薤白白芷丹參甘草炙蓯蓉獨活黃芩以上各一兩臘月豬脂一斤半上十四味細切以苦酒一升二合夏即漬一日冬二夜微火煎三上下酒氣盡成膏敷之極良治發背乳口已合皮止急痛生宍膏方丹參防風白芷細辛芎藭黃芩芍藥甘草炙黃耆牛膝槐子獨活當歸上十三味切以臘月脂五升微火煎三上下白芷黃膏成病上摩向火日三四治癰腫堅強不消不可用敷貼處黃芩膏方黃耆黃芩芎藭白蘞防風菵草白芷芍藥大黃細辛當歸以上各一兩上十一味㕮咀以豬脂四升微火上煎一沸一下白芷黃即成膏敷之堅硬者日可十易治癰疽止痛生肌鷗脂膏方松脂七兩芍藥當歸芎藭黃芩各一兩鷗脂七兩白蠟五兩上七味㕮咀以臘月豬脂二升二合微火煎一沸一下三十過成以摩於瘡上治癰疽金瘡續斷生宍膏方續斷乾地黃細辛當歸芎藭黃耆通草芍藥白芷牛膝附子炮製人參甘草炙以上各二兩臘月豬脂四升上十四味㕮咀著銅器中下膏諸藥漬之半日微火煎三上下白芷候黃膏成敷之瘡上日四五過良治癰疽瘡止痛生肉甜竹葉膏方甜竹葉五兩生地黃四兩大戟二兩臘月脂四升當歸續斷白芷菵草芎藭防風各二兩甘草一兩半炙芍藥一兩半蜀椒半兩去目汗閉口細辛大黃杜仲各半兩黃耆半兩上十七味㕮咀以豬脂微火煎五上下候白芷黃膏成敷瘡上甚良治癰疽敗壞生肉菵草膏方菵草當歸薤白黃芩甘草炙各二兩生地黃五兩白芷三兩大黃四兩續斷一兩上九味㕮咀以豬脂三升微火煎三上下白芷黃膏成敷瘡良治癰疽膿爛並小兒頭瘡牛領馬鞍及腸中諸惡耳聾痛風腫腳疼金木水火毒螯所中衆瘡百疹無所不治蛇銜膏方蛇銜大戟大黃芍藥附子炮當歸獨活菵草黃芩細辛芎藭蜀椒去目閉口汗薤白以上各一兩上十三味㕮咀以苦酒漬之淹一夜以豬脂一升半微火煎三上下膏成綿布絞去滓病在內酒下彈元大治癰疽食宍膏方松脂五兩雄黃別研雌黃野葛皮各二兩豬脂一斤漆頭蘆茹三兩巴豆一百枚去皮膜心上七味先煎松脂水氣盡下諸藥微火煎三上下膏成絞去滓納雄雌二黃攪調以膏著兌頭內瘡內口方六匕及宍兼新故初用病更腫赤但用如節度惡宍盡止勿使過也治癰疽大黃食宍膏方大黃附子莧草芎藭雄黃真珠末各一兩白蘞礬石黃芩漆頭蘆茹各二兩雄黃一兩上十一味㕮咀六物以豬脂一升四合微火煎三上下末蘆茹下煎成膏中以塗兌頭敷瘡中須惡肉盡勿使過也治癰疽茹食惡肉蘆茹散方漆頭蘆茹礬石硫黃雄黃以上各二分上四味搗篩攪令著兌頭內瘡口中惡宍盡止勿使過也治癰疽始作便敗壞發瘡膏方羊髓一兩甘草二兩胡粉五分大黃一兩豬脂二升上五味切合脂髓煎二物令煬納甘草大黃三上下去滓納胡粉攪令極調敷瘡日四五上治久病疥癬惡瘡膏方丹砂雄黃雌黃亂髮洗松脂白蜜以上各一兩蘆茹漆頭者三兩巴豆十四個去皮心臘月豬脂三升上九味先煎亂髮消盡內松脂煎三上下成膏絞去滓末茹內膏中煎攪極調敷瘡上日三易之治久病疥癬諸惡瘡毒五黃膏方雌黃雄黃黃連黃柏黃芩青木香白芷各二兩亂髮一團雞子大雞舌香一兩狼跋子四十枚上十味㕮咀以苦酒半升漬諸藥一夜以臘月脂三升先煎發一沸納諸藥三五沸止絞去滓成膏敷瘡上日五易之治病疥癬惡瘡散熱水銀膏方水銀礬石蛇床子黃連各一兩上四物兩度篩以臘月豬脂七合和並水銀攪令調打數萬過不見銀膏成敷瘡若膏少益取並小見瘡良龔慶宣加蘆茹一兩治面黃疱麝香膏方麝香二兩當歸附子芎藭白芷芍藥以上各一兩細辛二合杜衡二分上八味㕮咀以臘月豬脂一升二合煎諸藥三上下絞去滓別末研麝香安膏中攪令調敷疱上三易之治面查疱木蘭膏方木蘭防風白芷青木香牛膝獨活藁本當歸芍藥杜衡辛夷芎藭細辛各一兩麝香一分附子二分炮上十五味㕮咀諸藥以臘月豬脂一升微火煎三沸三上下去滓末下攪令調膏成敷疱上日三治查疱鸕鷀屎膏方上取鸕鷀屎一升搗篩臘月豬脂調和敷之治頭頽生髮白芷膏方白芷蔓荊子附子防風芎藭菵草細辛黃芩當歸蜀椒各一兩去汗閉口大黃一兩半馬鬃膏五合此所用多無上十二味切以臘月豬脂三升合諸藥微火煎三上下白芷色黃膏成洗頭澤發勿近面治婦人乳腫痛丹參膏方丹參芍藥各二兩白芷一兩上三味以苦酒漬一夜豬脂六合微火煎三上下膏成敷之治頭白頽瘡發落生白經年不瘥五味子膏方五味子二分菟絲子五分蓯蓉二分雄黃一分松脂二分蛇床子遠志去心各三分雌黃白蜜各一分雞屎半分上十味以豬膏一升二合煎先納雌黃次納雞屎次納蜜次納松脂次納諸藥並先各自末之膏成先以桑灰洗頭後敷之治疽瘻瘑疥諸惡瘡連年不瘥並小兒頭瘡悉治之膏方藜蘆附子蘆茹桂心天雄蛇床子野葛皮雄黃亂髮洗白芷半夏湯洗礬石細辛杏仁芎藭芍藥白朮烏頭各二兩黃連當歸藁本以上各二兩斑蝥菵草巴豆去皮心黃柏吳茱萸蜀椒各一兩去目閉口汗上二十七味㕮咀以苦酒漬一夜以臘月豬脂四斤微火煎令酒氣盡膏成日四五敷用多妙治久瘑疽諸瘡冶葛膏方冶葛皮黃連細辛杏仁菵草芍藥藜蘆附子乳發蘆茹芎藭白芷蛇床子桂心藁本烏頭白朮吳茱萸雄黃礬石天雄當歸以上各二兩斑蝥巴豆去皮心蜀椒去目汗閉口黃柏各一兩上二十六味㕮咀各搗篩以豬脂五升於銅器內微火煎諸藥七沸上下絞去滓更煎攪勻成膏以敷瘡上日四五丹砂膏方三首丹砂五兩芎藭三兩大黃二兩蜀椒二兩去目出汗白芷二兩麝香三兩升麻二兩冶葛皮二兩麻黃五兩去節丹參五兩巴豆二升去皮心桂心二兩附子十二枚皂莢二兩去皮子上十四味以豬脂六升春夏共用調合在後方消停又方丹砂三兩芎藭三兩大黃二兩蜀椒去目出汗二兩白芷二兩麝香六兩術二兩附子十二枚乾薑五分冶葛二兩丹參六兩細辛二兩巴豆三升去皮心上十三味秋冬共用亦在年中有所宜以意消息藥各搗羅之巴豆細切以苦酒漬一夜量足不須覆之明旦以豬脂成六升鐺中微火煎三上下膏成勿使旁人及雞犬貓見其膏同治共敘此方須是細意事持又方丹砂二兩末蜀椒去目閉口汗大黃白芷甘草炙以上各二兩巴豆三升去皮心麝香芎藭各二兩附子二枚升麻二兩冶葛皮犀角當歸烏頭各二兩丹參一斤上十五味切以苦酒漬之一夜以豬脂六升微火煎三上下膏成絞去滓用之此膏是四時常用日三此方無比丹砂膏敘治百病傷寒溫毒熱疾服如棗核大一枚鼻塞取半核大納鼻中縮氣令人聰里若耳聾取如兩棗核大煬之如水納其耳中三五年聾可瘥或寒癖腹滿堅脹及飛尸惡毒楚痛溫酒服霍亂當成未成已吐未痢白湯服棗核大若已痢一兩行而腹煩痛更服之眼中風膜膜或痛常下淚取如粟大注眼中自當下止或半自痛便愈又胸背喉頸痛摩足口中亦稍稍令常聞有膏氣人體自有不同者易為藥當服取利為度老小增減服膏之法得利若不利如人行十五里可與熱飲發當預作白薄粥令冷若過利要止者多進冷粥便住若能忍待藥勢儘自止更佳赤膏治百病方治病同丹砂膏用之冶葛皮一兩白芷一兩蜀椒二升去目閉口汗大黃芎藭巴豆三升去皮心附子十二枚丹參一斤豬脂六升上九味㕮咀以苦酒漬一宿合微火煎三上下白芷黃即膏成絞去滓用傷寒鼽鼻溫酒服如棗核大一枚賊風癰疽腫身體惡氣久溫痹骨節疼痛向火摩之瘑疥諸惡瘡以帛縛之鼠瘻疽痔下血身體隱軫癢搔成瘡汁出馬鞍牛領以藥敷之即愈腰背手足流腫拘急屈伸不快以膏敷之日三婦人産乳中風及難産服如棗核大並以膏如摩腹立生如食魚哽日五服愈如耳聾以膏如小豆大著耳中患息肉以膏納鼻中愈眼齒痛以膏如粢注背中白蘆醫當童子視以膏如粟注眥愈治熛疽丹妙膏方丹砂末犀角夜干大黃芎藭麝香末黃芩各二兩生地黃十兩切升麻前胡沉香各三兩青木香一兩上十二味㕮咀以苦酒漬淹一宿以豬脂五升微火煎三上下絞去滓納丹參麝香末攪調稍稍服之治疽麝香膏方麝香末凝水石黃芩丹砂末芎藭雞舌香青木香各二兩菵草三兩升麻三升羚羊角夜干大黃羊脂各三兩地黃汁一升上十四味切以苦酒漬一夜用豬脂六升微火上煎三上下絞去滓納麝香丹砂末攪令調成以摩病上甚良治疔腫生芎藭膏方生芎藭汁一升丹砂二兩生地黃二斤白芷三兩大黃三兩麝香末三兩甘草三兩炙當歸二兩升麻二兩薤白八兩上十味㕮咀以苦酒漬一夜豬脂五升微火煎三上下膏成摩於腫上治熛疽始發未曾治宜速服丹砂膏方丹砂末犀角二兩夜干三兩生地黃十兩大黃三兩升麻三兩芎藭三兩麝香二兩前胡三兩沉香二兩黃芩三兩青木香一兩上十二味㕮咀以豬脂五升微火煎三上下止絞去滓入麝香丹砂末攪令調溫酒服如棗核大日三服治風溫瘑疽諸惡瘡經年不瘥其著胸臆背日大不可視之恐見肺肺髓者皆主之敷當火須以意用之丹砂膏方丹砂雄黃末附子天雄乾地黃大黃當歸秦膠各二兩烏頭桂心黃連松脂茴芊各四兩蜀椒一升去目汗乾薑二兩巴豆一百枚去皮心蜈蚣四枚去頭足赤者石南草二兩上十八味㕮咀十六味以苦酒一斗漬一夜以豬脂六升微火煎三上下藥色膏成絞去滓納二石末攪令調敷瘡有口亦可兌瘡口此脂多治合即隨多少苦酒不必盡一斗以意量用之治瘑疥癬諸惡瘡丹砂膏方蜀椒三升去目汗丹砂細辛桂心各二兩附子三十枚前胡白芷各切一升芎藭切白朮吳茱萸各一升當歸一兩上十一味㕮咀諸藥唯椒茱萸不搗以苦酒漬一夜合淹以豬脂不中水者十斤細切合諸藥於銅器內煎三上下白芷黃成膏以綿布絞去滓如患風溫腫不消服如彈元大一枚若鼻塞不通以膏著鼻中若青盲風目爛眥癢痛茫茫不見細物以綿絮裹箸頭注膏中以敷兩眥至臥時再敷之齒痛亦如耳聾亦准之諸惡痛皆治之金瘡牛領馬鞍瘡亦敷之治下赤腹中有癰並癰疾在外即摩之在內即服之如彈元大一枚日三服此膏無所不治治小兒頭瘡並惡紫草膏方紫草三兩黃連女青白芷各一兩礬石三兩燒令汗出苦酒五合生地榆根一兩上七味納三味礬石紫草黃連為末入諸藥煎白芷黃膏成敷瘡上治小兒熱瘡水銀膏方水銀二兩胡粉二分松脂二兩豬肝四升上四味煎松脂水銀氣出下三物攪令不見銀放冷以敷瘡上治火瘡柏皮膏右皮去黑皮用白肉以豬脂少多煎去滓候凝隨實使之治熛疽浸淫廣大赤黑爛壞成瘡羊髓膏方羊髓二兩大黃二兩甘草一兩胡粉二分上四味㕮咀以豬脂二升半並胡粉微火煎三上下絞去滓候冷敷瘡上日四五治熱毒並結及腫成瘡升麻膏方升麻三兩白朮一兩牡蠣三分白芨二兩白蘞二兩菵草二分夜干二兩大黃二兩黃連二兩上九味㕮咀以豬脂三升微火煎膏成絞去滓以敷瘡上日四五治熱瘡生地黃膏方生地黃白蘞白芷黃連升麻黃芩大黃以上各十兩上七味㕮咀以豬脂一升半微火煎成膏絞去滓敷瘡日四五治惡瘡皆爛雄黃膏方雄黃礬石末藜蘆當歸黃連附子各二兩菵草芎藭白芨各一兩巴豆六十枚去皮心上十味㕮咀以豬脂二升微火煎成絞去滓納石末攪調敷瘡日四五治瘑疽瘻水銀膏方水銀二兩半胡粉二兩松脂二兩豬脂四升上四味先煎松脂水氣盡下胡粉攪令水銀盡不見可敷瘡日三亦治小兒疳熱瘡頭瘡治痱瘰癧瘡白蘞膏方白蘞三兩白芷三兩芎藭大黃黃連各二兩當歸二兩黃柏二兩豉八分炒羊脂三兩豬脂二升上十味㕮咀以二脂合煎納諸藥微火煎膏成去滓候凝敷之治皮膚中熱痱瘰癧白蘞膏方白蘞黃連各一兩生胡粉一兩上三味搗篩溶脂調和敷之治熱瘡生地黃膏方生地黃四兩黃連四兩大黃三兩黃柏甘草炙白蘞升麻各二兩上七味㕮咀以豬脂二升半微火合煎膏成絞去滓候凝可敷之治熱瘡生地黃膏方生地黃四兩黃連五兩白蘞芍藥白芨各二兩苦參升麻各三兩上七味㕮咀以豬脂二升半納諸藥同熬膏成去滓候凝敷之治溫熱諸瘡黃連膏方黃連白蘞白芷各二兩生胡粉一兩上四味細篩用豬脂調塗之治熱瘡蛇床子膏方蛇床子乾地黃二兩苦參一兩大黃通草二分白芷黃連狼牙二分上八味搗篩為細末用豬脂以意調和塗之治熱瘡木蘭膏方木蘭一兩白芷黃連各三兩黃柏二兩芍藥一兩梔子二十一枚黃芩二兩狼牙二兩夜干一兩蛇床子一兩上十味㕮咀以豬脂二升合諸藥微火煎膏成去滓治熱瘡黃連膏方黃連生胡粉各三兩白蘞二兩大黃二兩黃柏二兩上五味為末用豬脂以意調和塗之治灸瘡甘草膏方甘草一兩當歸一兩胡粉羊脂一兩半豬脂三兩上五味㕮咀以豬羊脂並諸藥微火煎成膏絞去滓候凝敷之治諸癰破後大膿血極虛黃耆膏方黃耆附子白芷甘草防風大黃當歸續斷芍藥各一兩蓯蓉一分生地黃五分細辛三分上十二味切以豬脂三升納諸藥微火慢煎候白芷黃色膏成絞去滓候凝塗瘡摩四邊口中日四過治癰疽已潰白芷摩膏方白芷三分甘草三分烏頭三分薤白十五枚青竹皮上五味以豬脂一升合煎候白芷黃膏成絞去滓塗四邊治諸疽瘡膏方蠟一兩亂髮礬石熬各一兩松脂一兩揀豬脂四兩上五味先下脂煎令消下發發消下礬石礬消下松脂松脂消下蠟蠟消膏成濾過候凝塗敷之治鼻中塞利鼻白芷膏方白芷通草蕤核各一分薰草二株羊髓八銖當歸一分上六味以清酒煉羊髓三過㕮咀諸藥煎膏成絞去滓用小豆大納鼻中日三治竹木所刺入手足壯不出膿疼痛羊屎膏方上取干羊屎搗篩用豬脂和以塗之瘡口立出治湯淚入宍爛壞術膏方術二兩附子二枚大者炮甘草一兩羊脂五兩松脂雞子大一塊豬脂五兩不入水者上六味微火上煎豬脂後納羊脂並諸藥又煎膏成絞去滓候凝塗瘡上日三又方柏樹皮四兩去黑處甘草三兩細切淡竹葉二兩切上三味以不中水豬膽一升二合入藥煎膏成絞去滓塗瘡上日三又方麻子一合取仁柏皮一兩取白白芷一兩生柳皮一兩去白上四味㕮咀以脂一升同煎膏成濾去滓候凝敷瘡日三治宍疽疥癬及惡瘡蘆茹膏方蘆茹三兩漆頭者雄黃雌黃末各一兩丹砂一兩研亂髮半兩洗上五味搗篩令調煎以先用豬脂二升半煎發取盡納諸藥微火更煎候膏成不令他人雞貓犬見日上三四治婦人妒乳生瘡雄黃膏方雄黃白蘞雄黃漆頭蘆茹各一兩亂髮一團如雞子大上五味各研搗篩以不中水豬脂二升先煎亂髮令盡下諸藥再微火煎候膏成放凝塗瘡上日三四治諸惡瘡麝香膏方麝香冷石雄黃丹砂各五分上四味各細研如粉以臘月豬脂量其多少調和如塗敷瘡時先用大黃湯放溫洗了淹干然後塗膏治頭瘡惡瘡骨疽等牛屎熏方取苦瓠截除底斷其鼻取牛屎者地上燒以無底瓠籠屎上引煙從瓠空出以瘡著煙上熏之自然止過三度即除六物滅瘢膏方衣中白魚雞屎白鷹糞白芍藥白蘞白蜂上藥研如粉以乳汁和塗瘢上日三良小品滅瘢方雞矢白一兩辛夷仁四分白附子二分細辛二分上四味酒浸一宿以羊脂六合微火煎三上三下去滓傷瘢以甘草湯洗訖塗之一方又有桂心一分又方鷹屎白一兩研白蜜和塗瘢上日三
