body:
  text: 卷二治金瘡止血散方烏草根三兩白芷一兩鹿茸二分燒灰當歸一兩芎藭一兩乾地黃一兩切蒸焙續斷一兩上七味搗篩令調著血出處即止治金瘡血肉瘻蝙蝠消血散方蝙蝠三枚燒令煙盡沫下絹篩之上以水服方寸匕一日服令盡當下如水血消也治金瘡肉瘻蒲黃散方七月七日麻勃一兩蒲黃二兩上二物搗篩為散溫酒調服一錢匕日五服夜再兩服治金瘡箭肉中不出箭白蘞散方白蘞二兩半夏三兩湯洗七遍生薑浸一宿熬過上二味為末調水服方寸匕日三服若輕淺瘡十日出深二十日出終不停住肉中治金瘡中腹腸出不能內之小麥飲噴瘡方取小麥五升水九升煮取四升去滓復以綿度濾之使極冷旁含噴之瘡腸自上漸入以冷水噴其背不中多人見亦不欲令旁人語又不可病人知或晚未入取病人席四角令病人舉搖須臾腸便自入十日之內不可飽食頻食而宜少勿使病人驚驚則煞人治金瘡腸出欲入磁石散方磁石三兩滑石三兩上二物下篩理令調日飲方寸匕日五服夜再服治金瘡煩悶止煩白芷散方白芷三兩芎藭二兩甘草二兩上三味熬令變色搗為散水調服方寸匕日五服夜再服治金瘡先有散石煩悶欲死大小便不通止煩消血解散硝石散方硝石澤瀉白蘞芍藥寒水石栝蔞以上各一兩上六味搗篩為散水服方寸匕日夜各一服或未通稍增之治金瘡痛不可忍煩疼不得住止痛當歸散方當歸甘草炙藁本桂心木占斯以上各一兩上五味合搗篩令調水服半方寸匕日三服夜一服治金瘡弓弩所中悶絶無所識琥碧散方琥碧隨多少搗篩以童子小便服之乃熱不過二服治金瘡弓弩所中筋急屈伸不得敗弩散方乾地黃干棗三枚杜仲二分當歸四分附子四分炮故敗弩筋燒灰取五分上七味合搗篩理令勻溫酒服方寸匕日三服夜一增一至三治金瘡內傷蛇銜散方蛇銜甘草炙芎藭白芷當歸各一兩續斷黃芩澤蘭乾薑桂心烏頭五分炮上十一味搗篩理令勻酒服方寸匕日三服夜一服治金瘡中筋骨續斷散方芎藭一兩半地黃二兩蛇銜二兩當歸一兩半蓯蓉一兩半乾薑三分炮續斷三兩附子三分炮漢椒三分出汗去目桂心三分人參一兩甘草一兩炙細辛二分白芷三分一本用芍藥一兩半上十四味搗篩理令勻調溫酒服之方寸匕日三服夜一服治金瘡煩疼麻黃散方麻黃六分去節甘草五分炙乾薑三分附子三分炮當歸三分白芷三分續斷三分黃芩三分芍藥三分桂心三分芎藭三分上十一味搗篩理令勻調溫酒服方寸匕日三服夜一服治金瘡煩滿疼痛不得眠睡白薇散方白薇栝蔞枳實炒辛夷去毛甘草炙石膏以上各一兩厚朴三分炙酸棗二分炙上八味為末調溫酒服方寸匕日三服夜一服治金瘡去血多虛竭內補當歸散方當歸三分芍藥五分乾薑三分辛夷去毛二分甘草三分炙上五味搗篩理令勻調溫服方寸匕日三服夜一服治金瘡去血多虛竭內補蓯蓉散方蓯蓉當歸甘草炙芎藭黃芩桂心人參芍藥乾薑吳茱萸白芨厚朴炙黃耆各一兩蜀椒三分出汗去目閉口上十四味搗篩理令勻調溫酒服方寸匕日三服夜一服治金瘡內塞澤蘭散方澤蘭防風蜀椒去目汗閉口石膏附子乾薑細辛辛夷去毛各二兩芎藭三分當歸三分炒甘草四分炙上十一味搗篩理令勻調溫酒服方寸匕日三夜一膿多倍甘草渴加栝蔞二分煩加黃芩二分腹滿氣短加厚朴二分瘡中血瘀加辛夷一倍治金瘡內塞黃耆散方黃耆三兩芎藭白芷當歸麻黃去節鹿茸黃芩細辛乾薑芍藥續斷桑蟲屎以上各一兩附子半兩炮山茱萸一兩上十四味搗篩理勻調溫酒服方寸匕日三服夜一服漸可至二日治金瘡中菵藥解毒藍子散方藍子五合升麻八兩甘草四兩炙王不留行四兩上四味搗篩理令勻調冷水服二方寸匕日三夜二及以方寸匕水和勻塗瘡上毒即解去矣治金瘡大渴內補瞿麥散方瞿麥芎藭當歸甘草炙乾薑桂心續斷厚朴炙白蘞蜀椒去目閉口汗辛夷去毛牡蠣末芍藥桔梗乾地黃防風各三分細辛二分栝蔞一分人參三分上十九味搗篩理令勻調溫酒服方匕日三夜一或筋骨斷更加續斷三分治被打腹中瘀血蒲黃散方蒲黃一升當歸二兩桂心二兩上三味搗篩理勻調酒服之方寸匕日三夜一不飲酒熟水下治癰疽金瘡續斷生肌膏方續斷乾地黃細辛當歸芎藭黃耆通草芍藥白芷牛膝附子炮人參甘草炙各十二兩臘月豬脂四升上十四味㕮咀諸藥納膏中漬半日微火煎三上候白芷色黃膏即成敷瘡上日四正膏中是豬脂煎治金瘡癰疽止痛生肌甘菊膏方菵草芎藭甘草炙防風黃芩大戟以上各一兩生地黃芍藥一兩半細辛大黃蜀椒去目閉口汗杜仲黃耆白芷各一兩上十四味㕮咀以臘月豬脂四升微火煎五上下白芷候黃成膏一方添甘菊二兩以敷瘡上日易兩次治癰疽金瘡生肌膏方大黃芎藭芍藥黃耆獨活當歸白芷以上各一兩薤白二兩別方一兩生地黃一兩別方二兩上九味合薤㕮咀以豬脂三升煎三上下白芷黃膏成絞去滓用磨之多少隨其意治金瘡腹內有瘀血烏雞湯方烏雌雞一隻大黃三兩細辛三兩人參一兩甘草一兩炙地黃三兩杏仁一兩去皮雙人盲蟲一兩當歸二兩芍藥一兩黃芩一兩桃仁二兩去皮碎大棗二十枚上十三味理烏雞如食法以水二斗煮雞取一斗㕮咀諸藥納雞汁中更煮之粥慎食他物治金瘡內有瘀血未及得出而反成膿烏雞湯方烏雞一隻白芷麥門冬去心甘草炙芍藥當歸以上各一兩桂心二兩瓜練二兩上八味先理雞如食法以水二斗煮取七升㕮咀諸藥納汁中更煮取三升去滓服七合日三夜勿食治金瘡有瘀血桃核湯方蟅蟲三十枚熬虻蟲水蛭各三十枚熬桂心三分大黃五兩桃核五十枚去皮切上六味酒水各五升㕮咀合煮取三升去滓服一升日三服治金瘡驚悸心中滿滿如車所驚怛豚心湯方豚心一具人參桂心甘草炙乾地黃桔梗石膏末芎藭當歸二兩上九味細切銼諸藥㕮咀先以水二斗煮心取汁八升納諸藥煮取一升一服八合一日令盡治金瘡癰疽生肉膏方黃耆細辛生地黃蜀椒去目汗閉口當歸芍藥薤白芎藭獨活蓯蓉白芷丹參黃芩甘草以上各一兩臘月豬脂二斤半上十五味㕮咀以苦酒一升合漬諸藥夏一夜冬二夜浸以微火煎三上候苦酒氣成膏用之治被打腹中瘀血白馬蹄散方白馬蹄燒令煙盡搗篩溫酒服方寸匕日三夜一亦治婦人血疾消為水
