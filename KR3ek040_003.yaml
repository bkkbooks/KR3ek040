body:
  text: 卷三治年四十已還強壯常大患熱癰無定處大小便不通大黃湯方大黃三兩梔子五十升麻二兩黃芩三兩芒硝一兩別方二兩上五味切以水五升煮取二升四合去滓下消絞調分溫三服快利為度治發癰疽兼結實大小便不通寒熱已服五痢湯吐出不得下大渴煩悶淡竹葉湯方淡竹葉切四升去尖栝蔞四兩通草前胡升麻茯苓黃芩知母甘草炙石膏末以上各二兩生地黃十兩芍藥一兩大黃黃耆三兩當歸一兩半人參一兩上十六味先以水一斗六升煮竹葉去葉取九升納諸藥後煮取三升二合分四服三日三夜一快利便止不必盡湯湯盡不利便合取利治發背髮乳四體有癰疽虛熱大渴生地黃湯方生地黃十兩竹葉四升黃芩黃耆甘草炙茯苓麥門冬去心以上各三兩升麻前胡知母芍藥各二兩栝蔞四兩大棗二十枚去核當歸一兩半人參一兩上十五味先以水一斗五升煮竹葉取一斗去葉納諸藥煮取三升六合分為四服日三夜一治發背乳癰已服生地黃湯取利後服此淡竹葉湯方淡竹葉四升麥門冬去心黃耆芍藥乾地黃生薑以上各三兩前胡黃芩升麻遠志去心栝蔞大棗十四枚當歸一兩上十三味先以水一斗八升煮竹葉小麥黃耆芍藥乾地黃生薑取一斗去滓內諸藥再煮取三升分溫三分上語煮竹葉小麥恐是麥門冬非是小麥也治癰疽虛熱生地黃湯方生地黃五兩人參甘草炙黃耆芍藥茯苓各三兩當歸芎藭黃芩通草各二兩大棗二十枚淡竹葉切成三升上十二味先以水二斗煮了水取一斗五升去滓復諸藥再煮取四升八合一服八合日三夜再能頓服為佳治癰疽內虛熱渴甚黃耆湯方生地黃八兩竹葉切成三升小麥二升黃耆黃芩前胡栝蔞四兩通草芍藥升麻茯苓甘草知母各二錢人參當歸各一錢上十六味先以水二斗煮竹葉及小麥取一斗二升去滓復煮諸藥取四升分四服日三夜一小便利除通草茯苓加麥門冬腹滿加石膏三兩熱盛去人參當歸治背生地黃湯方生地黃八兩人參甘草炙芍藥各二兩通草茯苓黃耆黃芩各三兩淡竹葉切二升大棗二十枚當歸芎藭各一兩上十二味先以水三斗煮竹葉取一斗去滓內諸藥再煮四升一服八合日三夜再若能每服一升佳治癰疽內虛黃耆湯方黃耆人參甘草炙芍藥當歸生薑各三兩大棗二十枚乾地黃茯苓各二兩白朮一兩遠志一兩半上十一味以水一斗三升煎取四升去滓分溫四服治癰疽五味竹葉湯方竹葉切二升五味子前胡當歸乾地黃人參各二兩小麥二升黃耆黃芩麥門冬去心生薑各三兩甘草一兩半炙升麻一兩大棗十四枚桂心半兩上十五味先以水二斗煮竹葉小麥取一斗去滓納諸藥煮取三升分溫四服日三夜一治癰疽發背乳大去膿後虛懾少氣欲死服此遠志湯方遠志去心當歸甘草炙桂心芎藭各一兩黃耆人參麥門冬去心三兩茯苓二兩乾地黃三兩生薑五兩大棗十四枚上件十三味以東流水一斗煮取三升二合分溫四服日三夜一治發背乳下復往服此白石脂湯方白石脂四兩龍骨三兩當歸桔梗女萎黃連去毛甘草以上各二兩白頭翁一兩乾薑二兩上九味以水九升煮取三升二合分四服下住便止不必盡服當下未即來日止治發癰疽取利熱小便退不用食物竹葉湯方淡竹葉切三升小麥二升乾地黃人參黃芩前胡升麻各二兩麥門冬去心生薑黃耆芍藥各三兩大棗十四枚桂心半兩遠志半兩去心當歸一兩甘草炙上十六味切先以水一斗八升煮竹葉小麥取一斗去滓內諸藥又煮取三升分二服羸者分四服日三夜一治癰疽取下後熱少退小便不利竹葉湯方淡竹葉切一升小麥三升乾地黃四兩黃耆人參甘草炙芍藥石膏通草升麻黃芩前胡各二兩大棗十四枚麥門冬三兩去心上十四味先以水一斗六升煮竹葉小麥取九升去滓內諸藥煮取三升二合強即分三服羸即四服日三夜一治癰疽取利後熱小便不利竹葉湯方竹葉切三升小麥二升人參黃芩前胡芍藥甘草炙乾地黃當歸桂心黃耆三兩麥門冬三兩去心龍骨牡蠣一兩末赤蛸螩三十枚炒大棗十四枚去核上十六味以水二斗煮竹葉小麥取一斗去滓內諸藥煮取四升分四服日三夜一治發背癰及乳兼味竹葉湯方淡竹葉切三升小麥三升黃耆黃芩五味子人參前胡乾地黃當歸各二兩大棗十四枚麥門冬二兩去心升麻一兩桂心半兩甘草一兩炙生薑三兩上十五味以水二斗煮竹葉小麥取一斗去滓內藥煮取三升分溫三服一日服治發背已潰而下不住白石脂湯白石脂四兩龍骨三兩當歸二兩桔梗二兩女萎白頭翁各四兩黃連二兩乾薑三兩上八味以水九升煮取三升三合去滓服八合日三夜一治發背已潰大膿汁虛懾少氣力內補黃耆湯方黃耆三兩乾地黃人參茯苓各二兩當歸芍藥芎藭桂心遠志去心各一兩甘草一兩半麥門冬去心三兩生薑五兩大棗十四枚上十三味以水一斗煮取三升二合去滓分溫四服日三夜一治癰疽內虛熱生地黃湯方生地黃五兩人參甘草炙芍藥茯苓芎藭通草黃芩當歸各二兩大棗二十枚竹葉切三升上十二味以水三斗煮竹地取半去滓內諸藥煮取四升分五服日三夜二能服一升可佳治發背黃耆湯方黃耆黃芩遠志麥門冬去心二兩乾地黃人參芎藭甘草炙芍藥當歸各一兩大棗二十枚生薑五兩雞肶胵二具勿去皮桑螵蛸十四枚炙上十四味㕮咀以水一斗先煮取四升五合一服九合日三服夜一服治炎疽枳實湯方甘林所祕不得枳實炙夜干升麻乾地黃黃芩前胡各三兩犀角一兩半大黃二兩半麝香半兩一方用甘草二兩上九味㕮咀以水九升煮取分溫三服須瘥也治腸癰大黃湯腸癰之為病診小腹腫痞堅按之則痛或在膀胱左右其色或赤或白色堅大如掌熱小便欲調時色色汗出時復惡寒其脈遲堅者未成膿也可下之當有血脈數膿成不可服此方大黃四兩牡丹三兩芥子半升硝石三合桃仁五十枚去皮炒切之上五味㕮咀以水六升五合分為兩服膿下無者下血大良治背上初欲作疹便服此大黃湯方大黃三兩梔子一百枚去皮升麻黃芩甘草炙三兩上五味以水九升煮取三升半分為三服得快下數行止不下更服治婦人妒乳辛夷湯方辛夷一升去毛大棗三十枚桂長一尺防風二分白朮甘草一尺炙生薑二分澤蘭一升切上八味切以水一斗煮取三升分溫三服治婦人客熱乳結腫或潰或作癰內補黃耆湯方黃耆茯苓各三兩芍藥二兩麥門冬三兩去心甘草二兩炙厚朴一兩炙人參三兩生薑四兩乾地黃三兩上九味切以水一斗二升煮取三升分五服日三夜二治癰腫患熱盛黃耆湯方黃耆麥門冬三兩去心黃芩六分梔子十四枚芍藥二兩栝蔞二兩乾地黃一兩升麻一兩上八味銼以水一斗煮取三升分溫三服治發癰疽腫潰去膿多里有虛熱內補黃耆湯方黃耆茯苓桂心人參麥門冬三兩去心甘草六分炙生薑遠志二兩心當歸二兩五味子大棗二十枚上十一味切以水一斗煮取四升分六服日四夜二治癰去膿多虛滿上氣竹葉湯方竹葉切二升半夏二兩湯洗甘草二兩炙厚朴三兩炙小麥四升生薑五兩當歸一兩麥門冬二兩茯苓桂心各一兩黃芩三兩上十一味切以水一斗半先煮竹葉小麥取九升去滓又煮諸藥取二升分溫三服治癰疽腫煩熱增損竹葉湯方竹葉一握切當歸茯苓人參前胡黃芩桂心芍藥各二兩甘草三兩炙大棗二十枚小麥一升麥門冬一升去心上十二味切以水一斗六升煮竹葉小麥取一斗一升去滓內諸藥煮取三升分服日三夜重加黃耆二兩胸中惡加生薑六兩下者減芍藥黃芩各六分如體強羸者以意消息之治癰疽後補塞去客熱黃耆湯方黃耆生薑石膏末甘草芍藥升麻人參以上二兩知母茯苓各一兩桂心六分麥門冬二兩去心大棗十四枚乾地黃一兩上十三味切以水一斗二升煮取四升分溫四服日三夜一
