body:
  text: 卷一序論昔劉涓子晉末于丹陽郊外照射忽見一物高二丈許射而中之如雷電聲若風雨其夜不敢前追詰旦率門徒子弟數人尋縱至山下見一小兒提罐問何往為我主被劉涓子所射取水洗瘡而問小兒曰主人是誰人云黃父鬼仍將小兒相隨還來至門聞搗藥之聲比及遙見三人一人開書一人搗藥一人臥爾乃齊唱叫突三人並走遺一卷癰疽方並藥一臼時從宋武北征有被瘡者以藥塗之即愈論者云聖人所作天必助之以此天授武王也於是用方為治千無一失姊適余從叔祖涓子寄姊書具敘此事並方一卷方是丹陽白薄紙本寫今手迹尚存從家世能為治方我而不傳其孫道慶與余鄰居情疑異常臨終見語家有神方兒子幼稚苟非其人道不虛行尋卷診候兼辨藥性欲以相傳囑余既好方術受而不辭自得此方於今五載所治皆愈可謂天下神驗劉氏昔寄龔方故草寫多無次第今輒定其前後蔟類相從為此一部流布鄉曲有識之士幸以自防齊永元元年太歲己卯五月五日撰道慶曰王祖母劉氏有此鬼方一部道慶祖考相承謹按處治萬無一失舅祖涓子兄弟自寫寫稱云無紙而用丹陽録永和十九年資財不薄豈復無紙是以此別之耳案永和只十二年且去宋武甚遠疑元嘉之訛黃父曰夫言癰疽何以別之岐伯答曰榮衛稽留於經脈之中久則血澀不行血澀不行則衛氣從之不通壅遏不得行火不止熱勝熱勝則肉腐為膿然不能陷膚於骨髓不為焦枯五臟不為傷故曰黃曰何為疽岐伯曰熱氣浮盛當其筋骨良肉無餘故曰疽疽上皮肉以堅上如牛領之皮癰者薄以澤背其候也黃父曰及如所説未知癰疽之性名發起處所診候形狀治與不治死活之期願一一聞之岐伯曰癰疽圖曰赤疽發額不寫十餘日死其五日可刺也其膿赤多血死未有膿可治人年二十五三十一六十九十五者在額不可見血見血者死禽疽發如軫者數十數其四日腫合牽核痛其狀若攣十日可刺其肉發身核寒齒如噤欲痓如是者十五日死抒疽發頂若兩耳下不寫十六日死六日可刺其色黑見膿而癰者死不可治人年十九二十三三十五三十九五十一五十五六十一八十七九十九百神在耳下不可見血見血者死丁疽發兩肩比起有所逐惡結血流內外榮衛不通發為丁疽三日身腫痛甚口噤如痓狀十日可刺不治二十日死蜂疽發髀背起心腧若連肩骨二十日不治死八日可刺其色赤黑膿見青者死不可治人年一十八二十四三十五六十七七十二九十八者百神在肩不可見血見血者死陰疽發髀若陰股始發腰強內不能自止數飲不能多五日堅痛不治三歲死刺疽發起肺腧不寫二十日死其八日可刺發麵赤其上肉如椒子者死不可治人年十九二十五二十九三十九五十七六十七十三八十一九十七百神在背不可見血見血者死脈疽發頸項如痛身隨而熱不欲動悄悄或不能食此有所大畏恐駭而不精上氣嗽其發引耳不可以腫二十日可刺不刺八十日死龍疽發背起胃俞若腎俞二十日不寫死九日可刺不刺其上赤下黑若青膿黑死發血膿者不死首疽發熱八十日一方云八九日大熱汗頭引血盡如嗽身熱同同如沸者皮頗腫淺刺之不刺二十日死榮疽發脅起若兩肘頭二十五日不寫死九日可刺膿多赤白而可治也人年一歲十六二十六三十二四十八五十八六十四八十九十六百神在脅不可見血見血即死行疽發如腫或後合相從往來不可要其所在刺之即愈勇疽發股起太陰若伏鼠二十五日不寫死其十日可刺勇疽發膿青黑者死白者尚可治不可治人年十一十五二十三十一三十三四十六五十九六十三七十五九十一百神皆在尻尾不可見血見血者死摽叔疽發背熱同同耳聾後六十日腫如聚水其狀若如此者可刺之但出水後及有血出即除愈也不可治人年五十七六十五七十三八十一九十七者百神在背不可見血見血者死旁疽發足趺若足下三十日不寫死其十二日可刺旁疽者白膿不太多其瘡上癢赤黑者死不可治人年十三二十九三十五六十一七十三九十三百神在足不可見血見血者死沖疽發小腸痛而振寒熱四日五日悄悄六日而變刺之五十日死敦疽發兩指頭若五指頭七八日不寫死其四日可刺其發而黑擁者不堪未過節可治一方不呼為敦疽恐是刺寫明堂引為敗疽疥疽發腋下若兩臂兩掌中振寒熱而嗌乾者飲多即嘔心煩悄悄六十日而漸合者如此可有汗如無汗者死一方云床疽明堂亦引為床疫筋疽皆發脊兩邊大筋其色蒼八日可刺若有膿在肌腹中十日死陳干疽發兩臂三四日痛不可動五十日身熱面赤六十日可刺如刺無血三四日病愈搔疽發手足五指頭起節其色不變十日之內可刺過時不刺後為蝕有癰在脈腋三歲死叔疽發身腫牽核而身熱不可以行不可以屈申成膿刺之以除白疽發脾若肘後癢自痛傷乃身熱多汗五六處有者死心主癰疽在股脛六日死發膿血六十日死黑疽發腫居背大骨上八日可刺過時不刺為骨疽骨疽膿出不可止壯熱碎骨六十日死脅少陽有癰腫在頸八日死發膿血者十日死瘡疽發身癢後痛此故傷寒氣入臟篤發為瘡疽九日可刺之不刺九十日死腰太陽脈有腫交脈屬於陽明在頸十日死發腫七十日死尻太陽脈有膿腫癰在足心少陽八日死發膿血六十日死或八十日死頭陽明脈有腫癰在尻六日死發膿血六十日死股太陰有腫癰在足太陽十七日死發膿血百日死肩太陽脈有腫癰在頸八日死發膿血百日死足少陽脈有腫癰在脅八日死發膿血六百日死手陽明脈有腫癰在淵腋一歲死發膿三歲死黑疽發淵腋死黑疽發耳中如米大此疽不治死黑疽發肩死黑疽發缺盆中名曰伏疽不治死赤疽發於脾半夜可治出歲死黑疽發肘上下不死可治髀解除指本黑頭赤死黑疽發掌中不死可治赤疽發陰股軟可治堅死赤疽發肥腸死黑疽發脿臏軟可治堅不可治赤疽發掌中不可治黑疽發跗上堅死足下發久腫癰色赤死癰高而光者不大熱用薄雍其肉平平無異而紫色者不須治但以黃耆並淡竹葉湯申其氣耳癰平而痛用八物黃耆薄大癰七日小癰五日其自有堅強色診寧生破發背及乳岩熱手近不得者令人之熱熟先服王不留行散外散外摩發背大黃膏若背生破無毒在乳者熟之候手按之若隨手起便是熟針法要膿看以意消息之胸背不可過一寸針良久不得膿即以食肉膏散差甕頭肉癰口中人體熱氣歇服木瓜散五日後癰欲瘥者排膿內寒散凡破癰之後病人便連綿欲死內寒熱腫自有似癰而非者當以手按腫上無所連是風毒耳勿針可服升麻湯外摩膏破癰口當合流下三分近一分針唯今極熱便不痛破癰後敗壞不瘥者作豬蹄湯洗之日再下湯二日故可用冬六七日湯半劑亦可用胸中斷氣斷氣者當入暗中以手按左眼視右眼見光者胸中結癰若不見光者瘭疽內發針傷脈血不出住實不寫留成癰腎脈來者大漸小陰結若肌肉痹癰為發寸口如此來大如未漸小矣有黑色者是石留黃毒有赤色者是丹砂毒有青色者是硇砂毒有似鹽顆者是鍾乳毒有黃水者是杏桃人毒有白水者是附子乾薑毒有膿者熱肉面等毒砂發白雄鴨頂上血一合已來取黑鉛湯一茶碗調服之解鍾乳發雄雞肘上血一合將針粉湯一茶碗調服之解附子發取附子皮三升豉半升相和以水一升煎約一茶碗服之解丹砂發取黑鉛黃耆防風伏龍肝各半兩水一升煎半茶碗去滓服之解
