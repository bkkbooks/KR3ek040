body:
  text: 卷四黃父一疽論九江黃父問於岐伯曰余聞腸胃受谷上焦出氣以溫分宍而養骨節通腠理中焦出氣如露注溪谷而燥經脈津液和調而變化赤為血血和則乘脈先滿乃注經絡經絡皆盈乃注於經絡句有脫誤陰陽已張因息乃行行有經紀周有道理與天合同不得休止切而謂之從虛去實瀉則不足疾則氣留去虛補實則有餘血氣已調形神乃持余已知血氣平與不平未知癰疽之所從生成敗之時死生之期期有遠近何以度之可知聞乎岐伯曰經脈流行不止與天同度與地同紀故大宿失度日月薄蝕也經始紀冰道流溢草薷不成五穀不植經路不通民不往來庵聚邑居別離異處血氣猶然則言其故夫血脈榮衛周流不休上應星宿下應經數寒客於經絡之中則血泣泣則不通不通則歸之不得復及故癰腫與寒氣化為熱熱勝則肉腐肉腐則為膿膿不瀉則爛筋筋爛則傷骨骨傷則水髓消不當骨肉不瀉筋枯空虛筋骨肌肉不得相親經脈敗漏熏於五臟五臟傷故死矣黃父曰願聞於癰疽之形與其期日岐伯曰略說癰疽極者一十八種癰發於嗌名曰猛疽猛疽不治則化為膿膿塞其咽半日死其為者寫則已含豕膏無冷寫三日而已一方無冷食發於頸者名曰夭疽其狀癰大而赤黑不急則熱氣不入淵脈腋前傷任脈內熏肝脈十餘日死陽氣大發消腦名曰腦漯其色不樂項痛如㓨以藏頭乘心者不治本作留字發於肩及臑者名曰雌癰其狀赤黑急治之此令大汗出至足不害五臟發於腋下赤堅者名曰米疽治之𥐦石欲細長疏或云塗豕六膏日以勿裹其癰堅而不潰者馬刀夾纓乃治之發於胸者名曰並疽其狀如大豆三四日起不早治下入腹不治十日死發於臆者名曰甘疽其狀如谷實萎瓜常寒熱急治之去其寒十歲似誤死死後膿自出發於脅者名曰改訾改訾者女子之病也久之其疾大癰膿治之其中乃有生肉大如赤小豆銼陵翹草陵根各一升水六升煮之竭為三升即強飲厚衣坐釜上令汗出至足已發於股陽明名曰股甕疽其狀不甚變而癰膿附骨不急治四十日死發於股陰名曰赤施疽不急治六日死在兩股之內不治六日死一方云十六日死發於尻名曰兌疽其狀赤堅大急急治之不速治三十日死發於膝名曰雌疽其狀癰色不寒熱而堅勿破破之死須以手緩柔之乃破諸疽發於節而相應之者不可治之也發於陽者百日死發於陰者四十日死發於腦名曰菟齧其狀疾赤至胃急治之不治煞人發於踝名曰走援其狀癰也急不變灸而止其寒熱不死發於足上名曰四淫其狀如癰不急治之百日死發於足名曰癘疽其狀初小指發急治之去其黑者不輒益不治百日死發於足指名曰脫疽其狀赤黑不死治之不衰急漸去之治不去必死矣夫癰疽者初發始微多不為急此實奇患惟宜速治之急治不苦速成病難救以此致禍能不痛哉具述所懷以悟後賢謹按黃父癰疽論所著緩急之處生死之期如有別癰之形色難易之治如左僧納私撰是用非是先賢恐後高雅故記之名字令惑之耳發皮宍淺腫高之赤即消不治亦愈發筋宍深腫下之堅其色或青或黃白黑或復微熱而赤宜急治之成消中半發附骨者或未覺肉宍肉宍已殃者癰疽之甚也肉宍似誤按宍即肉字也凡發背外皮薄為癰皮堅為疽如此者多現先兆宜急治之皮堅甚大多致禍矣夫癰壞後有惡宍當者以豬蹄湯洗其穢次敷飲宍膏散惡宍盡乃敷生肌膏散乃摩四邊令善宍速生當須絶房室慎風冷勿自勞動須筋脈復常乃可自勞耳不爾新宍易傷則重發便益潰爛慎之慎之相癰疽知是非可灸法癰疽之甚未發之兆肥渴為始始發之始或發日疽臰似若小癤或復大痛皆是微候宜善察之欲知是非重按其處是便隱復按四邊比方得失審定之後即灸第一便灸其上二三百壯又灸四邊一二百炷小者灸四邊中者灸六處大者灸八處壯數處所不患多也亦應即貼即敷令得所即消內服補暖湯散不已服冷藥外即冷敷不已用熱貼貼之法開其口泄熱氣相癰知有膿可破法癰大堅者未有膿半堅薄半有膿當上薄者都有膿便可破之所破之法應在下逆上破之令膿得易出用排針膿深難見上宍厚而生宍火針若外不別有膿可當其上數按之內便隱痛者宍殃堅者未有膿也按更痛於前者內膿已熟也膿泄去熱氣不爾長速速即不良治癰疽腫松脂帖方黃柏芎藭白芷白蘞黃耆黃芩防風芍藥菵草白蠟當歸大黃各一兩細辛二分膒脂三兩松脂二斤上十六味切曝乾極燥微火煎三上下手不得離布綿絞去滓貼之治癰疽腫松脂帖方當歸黃耆黃連芍藥黃芩大黃臘蜜芎藭各一兩松脂一斤半陳膒脂各一合半上十味細切合煎微火三上下膏成綿絞去滓向火塗紙上貼之治癰疽松脂帖腫方松脂一斤大黃三分膒脂一兩細辛半分黃芩一分半防風半分白芷白蘞芎藭當歸芍藥菵草黃連白蠟黃柏各一分上一十五味細切曝令極燥先煎脂蠟下松脂煬盡內諸藥三上下候色足絞以綿布水中以新竹片上火炙之施紙上貼之此藥大祕實有奇效不妄傳之治癰疽升麻薄極冷方升麻一兩大黃一兩白蘞六分黃耆一兩黃芩六分白芨一分乾者牡蠣二分粉龍骨一兩甘草二分炙芎藭一兩上十味篩和以豬膽調塗布敷之癰上燥易之治癰白蘞薄方白蘞大黃黃芩各等分上三味搗篩和雞子白塗布上敷癰上一燥輒易之亦可治又以三指撮置三升水中煮三沸綿注汁拭腫上數十過以寒水石沫塗腫上紙覆之燥復易一易輒以煮汁拭之晝夜二十易之治癰疽始一二日痛微內薄令消豬膽薄方黃耆龍骨青木香梔子仁羚羊角乾地黃升麻白蘞大黃黃柏黃芩芎藭赤小豆麻黃去節黃連犀角一兩上十六味各等分搗篩以豬膽調令如泥以故布開口如小豆大以泄熱氣治癰腫熱盛口燥患渴除熱止渴黃耆湯方黃耆栝蔞乾地黃升麻各二兩麥門冬三兩去心梔子二十枚芍藥黃芩一兩半上八味以水一斗煮取三升分溫三服治客熱鬱積在內或生癤黃耆湯方黃耆二兩人參一兩芎藭當歸甘草炙各一兩遠志去心乾地黃各二兩大棗二十枚生薑五兩麥門冬去心五兩上十味切以水一斗二升煮取三升分溫三服治癰未潰黃耆湯方黃耆四兩甘草二兩炙桂心三兩芍藥半夏生薑各八兩飴一斤上七味以水七升煮取三升飴化分三服治癰內補竹葉黃耆湯方竹葉切一升黃耆四兩甘草二兩芍藥四兩黃芩一兩人參二兩桂心一兩如冷用半兩大棗十二枚乾地黃二兩升麻三兩茯苓生薑各一兩上十二味以水二斗煮竹葉澄清取九升內諸藥更煮取三升分溫三服治補度冷下赤石脂湯方赤石脂人參甘草炙乾薑各二兩龍骨一兩碎附子大者一枚炮上六味切以水八升煮取二升半去滓分溫三服如人行十里進一服治取冷過寒下蝕見出溫中湯方甘草六分炙乾薑六分附子炮去皮破六分蜀椒二百四十粒去口者出汗上四味切以水六升煮取二升分溫三服治斷下補骨附子湯方附子二分炮當歸人參黃連甘草炙各一兩乾薑桂心芍藥各二分蜀椒去汗目閉口半分上九味以水五升煮取一斗五合去滓分溫二服治癰瘡及惡瘡有惡宍豬蹄湯洗方豬蹄一具治如食法白蘞二兩白芷二兩黃連一兩狼牙二兩芍藥二兩黃芩獨活大黃各一兩上九味以水三斗煮豬蹄一斗五升去蹄內諸藥煮煮五升洗瘡日四次甚良治癰疽腫壞多汁豬蹄湯方豬蹄一具治如食法芎藭甘草炙大黃黃芩各二兩芍藥三兩當歸二兩上七味先以水一斗五升煮蹄取八升去蹄內諸藥更煮取三升去滓及溫洗瘡上日三亦可布內湯中敷瘡腫上燥復之治肘疽方黃連皂莢各等分炙去皮子上二味搗下和以淳苦酒調令如泥塗滿肘以綿厚敷之日三易良治癰疽最膿增損散方黃耆五分膿多倍之小豆一分熱口乾倍之芎藭二分肉未生倍之白蘞三分有膿瘡不合倍之栝蔞三分若小便利倍之上六味搗篩令細酒調溫服方寸匕日三治癰消膿木占斯散方木占斯桂心人參細辛敗醬乾薑厚朴甘草炙防風桔梗以上各一兩上十味搗篩酒服方寸匕入咽覺流入瘡中若癰及疽之不能發壞者可服瘡未壞去敗醬已發膿納入敗醬此藥時有化癰疽成水者方正桂為異故兩存焉案正桂句似誤治發背及婦人發房並腸癰木占斯散方木占斯厚朴炙甘草炙細辛栝蔞防風乾薑人參桔梗敗醬以上各一兩上十味搗篩清酒服方寸匕日七夜四以多為善敗醬草名也病在上者當吐在下者當下膿血此謂腸癰之屬也諸病在裡惟服此藥即覺有力及癰疽便即腹痛長服治諸瘡及疽痔瘡已潰便即早愈凡俗流醫不知用此藥發背有不善而渴便勤服之若藥力行覺渴心便消散若雖服壞終無苦但晝夜服勿懈也發此藥消散不覺腫去時即愈或長服即去敗醬偏治婦人乳腫諸産疵速愈良又云惟服有異始覺背有不善之也治諸癰疽已潰未潰瘡中疼痛膿血不絶瞿麥散方瞿麥白芷黃耆當歸細辛芍藥薏苡仁芎藭赤小豆末各一兩上九味先以清酒小豆出於銅器中熬令乾後漬漬後復熬五過止然後治末合搗篩溫酒服方寸匕晝夜各五三日後痛癢者肌肉也又方用苦酒漬小豆多痛倍瞿麥瘡口未開倍白芷多膿倍黃耆薏苡仁芍藥等治癰食惡宍散方藜蘆一分半真珠一分半石硫黃雌黃麝香各三分馬齒礬石熬漆頭蘆茹各三分上九味篩搗粉瘡上亦可為膏和敷瘡上治癰疽食惡宍散方雄黃一兩礬石一分熬蘆茹一兩上三味搗篩稍著之隨用多少不限一兩治癰疽兌膏方當歸芎藭白芷松脂各二兩烏頭一兩豬脂二升巴豆十枚去心皮上七味㕮咀納膏中微火合煎三沸已納松脂攪合相得以綿布絞之去滓以膏著綿絮兌頭丈作兌兌之瘡雖深淺兌之膿就兌盡即善肉瘡淺者不起兌著瘡中日三惡肉盡則止治食宍青龍膏方白礬二兩火煉末之熟梅二升去核鹽三合大錢二十七枚上四味於銅器中猛火投之摩滅成末乃和豬脂搗一千杵以塗瘡上甚痛勿怪此膏食惡宍盡復著可敷蛇銜膏塗之令善宍復生治癰疽金瘡生肉膏方大黃芍藥黃耆獨活白芷芎藭各一兩當歸一兩薤白二兩生地黃三兩上九味㕮咀以盛煎豬膏三升煎三上下以綿布絞去滓用兌摩多少隨意常用之治丹癰疽始發焮熱浸淫長成㩉湯方升麻黃芩各三兩黃連大黃各二兩當歸一兩甘草一兩炙芎藭二兩芒硝三兩羚羊角屑各一兩上九味㕮咀以水一斗三升煮取五升絞去滓鐺中納芒硝上火攪令成沸盡滓稍分適冷熱貼帛㩉腫上數過其熱隨手消散王練甘林所祕不傳此方
